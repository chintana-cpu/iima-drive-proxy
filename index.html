<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIMA Ventures — Portfolio Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#070d18;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}

  .header{padding:14px 24px;border-bottom:1px solid #0f1e35;background:#080e1c;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .header-title{font-weight:700;font-size:14px}
  .header-sub{font-size:11px;color:#4b6a8a;margin-top:1px}
  .header-count{margin-left:auto;font-size:11px;color:#334155;background:#0a1628;padding:4px 10px;border-radius:12px;border:1px solid #1a3050}

  .layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 57px)}

  /* Sidebar */
  .sidebar{width:280px;flex-shrink:0;border-right:1px solid #0f1e35;display:flex;flex-direction:column;background:#080e1c}
  .search-wrap{padding:12px}
  .search-input{width:100%;padding:9px 14px;border-radius:10px;background:#0c1829;border:1px solid #0f1e35;color:#e2e8f0;font-size:12px;outline:none}
  .search-input:focus{border-color:#2563eb}
  .search-input::placeholder{color:#1e3a5f}
  .company-list{overflow-y:auto;flex:1}
  .company-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #0a1628;transition:background 0.15s}
  .company-item:hover{background:#0c1829}
  .company-item.active{background:#0f1f38;border-left:2px solid #2563eb}
  .company-name{font-size:13px;font-weight:500;color:#e2e8f0}
  .company-domain{font-size:11px;color:#334155;margin-top:2px}
  .status-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;margin-top:4px;font-weight:600}
  .status-active{background:#16324a;color:#34d399}
  .status-exited{background:#2d1f4a;color:#a78bfa}
  .status-passive{background:#1a2a1a;color:#6b7280}
  .status-writtenoff{background:#3a1a1a;color:#ef4444}
  .status-other{background:#1a1a2a;color:#6b7280}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .main-header{padding:16px 24px;border-bottom:1px solid #0f1e35;background:#080e1c}
  .main-company{font-weight:700;font-size:16px}
  .main-domain{font-size:12px;color:#4b6a8a;margin-top:2px}

  /* Fields panel */
  .fields-panel{padding:16px 24px;border-bottom:1px solid #0f1e35;background:#080e1c}
  .fields-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
  .field-card{background:#0c1829;border:1px solid #0f1e35;border-radius:8px;padding:10px 12px}
  .field-label{font-size:10px;color:#4b6a8a;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px}
  .field-value{font-size:13px;color:#e2e8f0;font-weight:500}
  .field-value.number{color:#60a5fa;font-family:monospace}
  .field-value.status-active{color:#34d399}
  .field-value.status-exited{color:#a78bfa}
  .field-value.status-writtenoff{color:#ef4444}
  .fields-loading{font-size:12px;color:#334155;padding:8px 0}

  /* Doc area */
  .main-body{display:flex;flex:1;overflow:hidden}
  .doc-list{width:240px;flex-shrink:0;border-right:1px solid #0f1e35;overflow-y:auto;background:#080e1c}
  .doc-list-header{padding:10px 14px;font-size:10px;color:#4b6a8a;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;border-bottom:1px solid #0f1e35}
  .doc-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #0a1628;font-size:12px;color:#94a3b8;transition:background 0.15s;line-height:1.4}
  .doc-item:hover{background:#0c1829;color:#e2e8f0}
  .doc-item.active{background:#0f1f38;color:#60a5fa;border-left:2px solid #2563eb}
  .doc-reader{flex:1;overflow-y:auto;padding:24px;background:#070d18}
  .doc-title{font-size:13px;font-weight:600;color:#60a5fa;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #0f1e35}
  .doc-content{font-size:12px;color:#94a3b8;line-height:1.8;white-space:pre-wrap;font-family:'SF Mono',monospace}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#334155;gap:8px}
  .empty-icon{font-size:32px}
  .empty-text{font-size:13px}

  .loading{display:flex;align-items:center;gap:8px;color:#3b82f6;font-size:12px;padding:16px}
  .dot{width:5px;height:5px;border-radius:50%;background:#3b82f6;animation:dot 1.2s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:0.2s}
  .dot:nth-child(3){animation-delay:0.4s}
  @keyframes dot{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}

  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#070d18}
  ::-webkit-scrollbar-thumb{background:#0f1e35;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🏦</div>
  <div>
    <div class="header-title">IIMA Ventures — Portfolio Dashboard</div>
    <div class="header-sub">Affinity CRM · Google Drive</div>
  </div>
  <div class="header-count" id="count">Loading…</div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="search-wrap">
      <input class="search-input" id="search" placeholder="Search companies…" oninput="filterCompanies()" />
    </div>
    <div class="company-list" id="companyList">
      <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div> Loading portfolio…</div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="empty">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">Select a company to view details</div>
    </div>
  </div>
</div>

<script>
  let allCompanies = [];
  let activeCompany = null;

  function getStatusClass(status) {
    if (!status) return 'status-other';
    const s = status.toLowerCase();
    if (s.includes('active')) return 'status-active';
    if (s.includes('exit')) return 'status-exited';
    if (s.includes('written') || s.includes('write')) return 'status-writtenoff';
    if (s.includes('passive')) return 'status-passive';
    return 'status-other';
  }

  function formatNumber(val) {
    if (!val && val !== 0) return '—';
    const n = parseFloat(val);
    if (isNaN(n)) return val;
    if (n >= 10000000) return '₹' + (n/10000000).toFixed(2) + ' Cr';
    if (n >= 100000)   return '₹' + (n/100000).toFixed(2) + ' L';
    return '₹' + n.toLocaleString('en-IN');
  }

  function formatFieldValue(name, val) {
    const numberFields = ['CIIE Investment (INR)','Post Money Valuation','CIIE Grant (INR)','Exit Amount','Follow-On Raised (INR)','Last Valuation (INR)'];
    const percentFields = ['IRR','Multiplier','Current Stake'];
    if (numberFields.includes(name)) return { display: formatNumber(val), cls: 'number' };
    if (percentFields.includes(name)) return { display: val + (name === 'IRR' ? '%' : 'x'), cls: 'number' };
    return { display: val, cls: '' };
  }

  async function loadCompanies() {
    try {
      const r    = await fetch('/api/affinity');
      const data = await r.json();
      allCompanies = data.companies || [];
      document.getElementById('count').textContent = allCompanies.length + ' companies';
      renderCompanies(allCompanies);
    } catch (e) {
      document.getElementById('companyList').innerHTML = `<div style="padding:16px;color:#ef4444;font-size:12px">Failed: ${e.message}</div>`;
    }
  }

  function renderCompanies(list) {
    const el = document.getElementById('companyList');
    if (!list.length) { el.innerHTML = '<div style="padding:16px;color:#334155;font-size:12px">No companies found</div>'; return; }
    el.innerHTML = list.map(c => {
      const statusClass = getStatusClass(c.status);
      return `<div class="company-item ${activeCompany?.id === c.id ? 'active' : ''}" onclick='selectCompany(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
        <div class="company-name">${c.name}</div>
        <div class="company-domain">${c.domain || '—'}</div>
        ${c.status ? `<span class="status-badge ${statusClass}">${c.status}</span>` : ''}
      </div>`;
    }).join('');
  }

  function filterCompanies() {
    const q = document.getElementById('search').value.toLowerCase();
    renderCompanies(q ? allCompanies.filter(c => c.name.toLowerCase().includes(q) || (c.domain||'').toLowerCase().includes(q)) : allCompanies);
  }

  async function selectCompany(company) {
    activeCompany = company;
    filterCompanies();

    document.getElementById('main').innerHTML = `
      <div class="main-header">
        <div class="main-company">${company.name}</div>
        <div class="main-domain">${company.domain || 'No domain'}</div>
      </div>
      <div class="fields-panel">
        <div style="font-size:11px;color:#4b6a8a;font-weight:600;letter-spacing:0.05em;text-transform:uppercase">Affinity CRM Fields</div>
        <div id="fieldsContent"><div class="fields-loading">Loading CRM data…</div></div>
      </div>
      <div class="main-body">
        <div class="doc-list">
          <div class="doc-list-header">Documents</div>
          <div id="docList"><div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
        </div>
        <div class="doc-reader" id="docReader">
          <div class="empty"><div class="empty-icon">📄</div><div class="empty-text">Select a document</div></div>
        </div>
      </div>
    `;

   loadFields(company.list_entry_id);
    loadDocList(company.name);
  }

  async function loadFields(entityId) {
    try {
      const r    = await fetch(`/api/fields?entity_id=${entityId}`);
      const data = await r.json();
      const fields = data.fields || {};
      const el = document.getElementById('fieldsContent');

      if (!Object.keys(fields).length) {
        el.innerHTML = '<div class="fields-loading">No CRM data available</div>';
        return;
      }

      el.innerHTML = `<div class="fields-grid">${
        Object.entries(fields).map(([name, val]) => {
          const { display, cls } = formatFieldValue(name, val);
          const statusCls = name === 'Status' ? getStatusClass(val) : '';
          return `<div class="field-card">
            <div class="field-label">${name}</div>
            <div class="field-value ${cls} ${statusCls}">${display || '—'}</div>
          </div>`;
        }).join('')
      }</div>`;
    } catch (e) {
      document.getElementById('fieldsContent').innerHTML = `<div style="color:#ef4444;font-size:12px">Error: ${e.message}</div>`;
    }
  }

  async function loadDocList(companyName) {
    try {
      const r    = await fetch(`/api/docs?company=${encodeURIComponent(companyName)}&list_only=true`);
      const data = await r.json();
      const docs = data.all_docs || [];
      const el   = document.getElementById('docList');

      if (!docs.length) { el.innerHTML = '<div style="padding:14px;color:#334155;font-size:12px">No documents found</div>'; return; }

      el.innerHTML = docs.map((doc, i) => `
        <div class="doc-item" id="docItem${i}" onclick="loadDoc('${companyName.replace(/'/g,"\\'")}','${doc.replace(/'/g,"\\'").replace(/\\/g,"\\\\")}',${i})">
          ${doc.replace(' (Readable)','')}
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('docList').innerHTML = `<div style="padding:14px;color:#ef4444;font-size:12px">${e.message}</div>`;
    }
  }

  async function loadDoc(companyName, docName, idx) {
    document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById('docItem' + idx);
    if (activeEl) activeEl.classList.add('active');

    const reader = document.getElementById('docReader');
    reader.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div> Reading document…</div>';

    try {
      const r    = await fetch(`/api/docs?company=${encodeURIComponent(companyName)}&query=${encodeURIComponent(docName)}`);
      const data = await r.json();
      reader.innerHTML = `
        <div class="doc-title">📄 ${data.document || docName}</div>
        <div class="doc-content">${escHtml(data.content || 'No content available')}</div>
      `;
    } catch (e) {
      reader.innerHTML = `<div style="color:#ef4444;font-size:12px;padding:16px">Error: ${e.message}</div>`;
    }
  }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  loadCompanies();
</script>
</body>
</html>
